services:
  postgres:
    image: postgres:17-alpine
    container_name: wds-food-delivery-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wds}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wds_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-food_delivery}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wds} -d ${POSTGRES_DB:-food_delivery}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
