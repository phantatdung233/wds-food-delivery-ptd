name: Kiểm tra bài

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm -C apps/web install --frozen-lockfile
      - run: node scripts/check-repo.mjs --build

  lighthouse:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm -C apps/web install --frozen-lockfile
      - run: pnpm -C apps/web build
      - run: pnpm dlx @lhci/cli@0.14.0 autorun --config=./lighthouserc.json
      # LHCI only prints the score when an assertion FAILS, and never prints the
      # per-audit numbers. Upload the raw reports on every run so a red build can
      # be diagnosed from real metrics instead of guesswork.
      # include-hidden-files is required: .lighthouseci is a dot-directory, and
      # upload-artifact silently skips hidden paths without it.
      # if-no-files-found: error so a missing report fails the job instead of
      # quietly turning data loss into a green tick.
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: lighthouse-reports
          path: .lighthouseci
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

